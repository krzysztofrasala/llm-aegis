name: LLM Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Lint & unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Validate suites
        run: python -m src.cli validate --suite suites/

      - name: Unit tests (mocked, no LLM required)
        run: pytest

  ollama-security-scan:
    name: Live security scan (Ollama llama3.2:1b)
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 30
    env:
      LLM_PROVIDER: ollama
      LLM_MODEL: llama3.2:1b
      # CPU-only runners are slow; give each request generous time.
      REQUEST_TIMEOUT_SECONDS: "180"
      # The bundled suites target a deliberately vulnerable mock application, so
      # findings are expected. Set the repository variable AEGIS_ENFORCE_GATE to
      # "true" to make HIGH/CRITICAL findings fail this job.
      AEGIS_ENFORCE_GATE: ${{ vars.AEGIS_ENFORCE_GATE || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:11434/api/tags > /dev/null; then
              echo "Ollama is ready"
              exit 0
            fi
            # The installer normally starts a service; fall back to a manual start.
            if [ "$attempt" -eq 5 ]; then nohup ollama serve > ollama.log 2>&1 & fi
            sleep 2
          done
          echo "::error::Ollama did not become ready"
          exit 1

      - name: Pull model
        run: ollama pull "$LLM_MODEL"

      - name: Run security scan
        run: |
          set +e
          python -m src.cli run --suite suites/ \
            --output reports/security_report.json \
            --output reports/security_report.md \
            --output reports/security_report.html
          code=$?
          set -e

          if [ -f reports/security_report.md ]; then
            cat reports/security_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

          case "$code" in
            0) echo "Security gate passed." ;;
            1)
              if [ "$AEGIS_ENFORCE_GATE" = "true" ]; then
                echo "::error::HIGH/CRITICAL security tests did not pass."
                exit 1
              fi
              echo "::warning::HIGH/CRITICAL security tests did not pass (gate not enforced)."
              ;;
            *)
              echo "::error::Scan could not run (exit code $code)."
              exit "$code"
              ;;
          esac

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-security-report
          path: reports/
          if-no-files-found: warn
