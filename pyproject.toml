[project]
name = "llm-aegis"
version = "0.1.0"
description = "Automated LLM security testing & red teaming framework mapped to the OWASP Top 10 for LLM Applications."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "openai>=1.40.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "PyYAML>=6.0.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "jinja2>=3.1.4",
]

[project.urls]
Homepage = "https://github.com/krzysztofrasala/llm-aegis"
Issues = "https://github.com/krzysztofrasala/llm-aegis/issues"

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "pytest-mock>=3.14.0", "ruff>=0.5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI defaults as call expressions.
extend-immutable-calls = ["typer.Option", "typer.Argument", "pathlib.Path"]
